{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="text-center mb-3">Upload Media</h2>
            <p class="text-muted text-center">Upload an image or video for background processing.</p>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_original_file" class="form-label fw-bold">Select Image or Video:</label>
                    
                    <input type="file" name="original_file" id="id_original_file" class="form-control" accept="image/*,video/*" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Upload & Create Job</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
